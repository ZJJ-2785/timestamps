<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Timestamps</title>
  <link rel="icon" href="icon.png">
  <link rel="stylesheet" href="app.css">
  <script>
    (function () {
      var d = matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.dataset.theme = d ? 'dark' : 'light';
      // The color theme picked last time, so the window doesn't flash the classic colors.
      try {
        var p = JSON.parse(localStorage.getItem('tsPalette') || 'null'), c = p && (d ? p.dark : p.light);
        if (c && c !== 'classic') document.documentElement.dataset.palette = c;
        if (localStorage.getItem('ts.nav')) document.documentElement.classList.add('nav-collapsed');
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-logo" id="brand-logo" aria-hidden="true"><img src="icon.png" width="28" height="28" alt=""></span>
        <span id="brand-name">Timestamps</span>
        <button id="collapse" class="btn btn-icon btn-sm btn-ghost collapse" type="button">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18"/></svg>
        </button>
      </div>
      <nav id="nav" class="nav"></nav>
      <div class="sidebar-foot">
        <div id="timer"></div>
        <div id="live" class="live"></div>
        <button id="live-rail" type="button" class="rail-live bare"></button>
        <div id="nav-settings" class="nav"></div>
      </div>
    </aside>
    <main id="view" class="main"></main>
  </div>
  <div id="overlays"></div>
  <div id="toasts" class="toasts"></div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
